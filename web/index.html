<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 48px 56px;
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7289da, #28a8ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        p {
            color: #888;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0d2d0d;
            border: 1px solid #1a4d1a;
            border-radius: 999px;
            padding: 8px 20px;
            font-size: 0.875rem;
            color: #4caf50;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .links {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        a {
            color: #7289da;
            text-decoration: none;
            font-size: 0.875rem;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🌉</div>
        <h1>TeleBridge</h1>
        <p>A bridge between Telegram and Discord — forwarding messages between your communities in real time.</p>
        <div class="status">
            <div class="dot"></div>
            Bot is running
        </div>
        <div class="links">
            <a href="https://github.com/TeleBridge/TeleBridge" target="_blank">GitHub</a>
            <a href="https://discord.com/invite/NKdSrmky6b" target="_blank">Support</a>
        </div>
    </div>
</body>
</html>
